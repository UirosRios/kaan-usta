<!doctype html>
<html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yol kalitesi haritası</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  html, body { margin: 0; height: 100%; font-family: system-ui, sans-serif; background: #fcfcfb; }
  #harita { position: absolute; inset: 0; }
  .kutu { background: rgba(252,252,251,.94); padding: 8px 10px; border-radius: 6px; font-size: 12px; color: #0b0b0b; line-height: 1.5; max-width: 280px; }
  .kutu b { font-size: 13px; }
  .sade { filter: grayscale(1) brightness(1.08) contrast(0.85); }
  .serit { display: flex; height: 14px; margin: 4px 0 2px; } .serit span { flex: 1; }
  .uclar { display: flex; justify-content: space-between; color: #52514e; }
  .no { background: #6a1b9a; color: #fff; border: 2px solid #fff; border-radius: 50%; font: bold 11px/18px system-ui, sans-serif;
         text-align: center; box-shadow: 0 1px 3px rgba(0,0,0,.45); }
  .no.tek { opacity: .55; }
</style></head><body><div id="harita"></div>
<script>
const V = {"kutular": [{"s": [[40.98028206970895, 29.021557722852187], [40.98050664750269, 29.021855291346917]], "r": "#e53935", "o": 0.8, "i": "3. Sokak<br>2 sürüş, 97 satır<br>hız 13,4 km/h · RMS 8,76 m/s² · indeks 9,63<br>2 darbe"}, {"s": [[40.9800574919152, 29.021557722852187], [40.98028206970895, 29.021855291346917]], "r": "#e53935", "o": 0.8, "i": "3. Sokak<br>2 sürüş, 100 satır<br>hız 12,5 km/h · RMS 8,01 m/s² · indeks 8,64"}, {"s": [[40.98050664750269, 29.021557722852187], [40.980731225296445, 29.021855291346917]], "r": "#fb8c00", "o": 0.8, "i": "3. Sokak<br>2 sürüş, 29 satır<br>hız 9,5 km/h · RMS 6,25 m/s² · indeks 7,82"}, {"s": [[40.97983291412145, 29.020665017367985], [40.9800574919152, 29.02096258586272]], "r": "#fdd835", "o": 0.8, "i": "Ana Cadde<br>2 sürüş, 99 satır<br>hız 14,2 km/h · RMS 5,16 m/s² · indeks 5,43<br>6 darbe"}, {"s": [[40.97983291412145, 29.021260154357453], [40.9800574919152, 29.021557722852187]], "r": "#fdd835", "o": 0.8, "i": "Ana Cadde<br>2 sürüş, 115 satır<br>hız 13,3 km/h · RMS 4,52 m/s² · indeks 5,04<br>4 darbe"}, {"s": [[40.97983291412145, 29.02036744887325], [40.9800574919152, 29.020665017367985]], "r": "#fdd835", "o": 0.8, "i": "Ana Cadde<br>2 sürüş, 102 satır<br>hız 13,8 km/h · RMS 4,71 m/s² · indeks 4,81"}, {"s": [[40.97983291412145, 29.021557722852187], [40.9800574919152, 29.021855291346917]], "r": "#fdd835", "o": 0.8, "i": "Ana Cadde<br>3 sürüş, 125 satır<br>hız 13,4 km/h · RMS 4,75 m/s² · indeks 4,80<br>1 darbe"}, {"s": [[40.97983291412145, 29.019772311883784], [40.9800574919152, 29.020069880378518]], "r": "#fdd835", "o": 0.8, "i": "İsimsiz footway (OSM 1004)<br>2 sürüş, 37 satır<br>hız 10,4 km/h · RMS 3,70 m/s² · indeks 4,75"}, {"s": [[40.97983291412145, 29.020069880378518], [40.9800574919152, 29.02036744887325]], "r": "#fdd835", "o": 0.8, "i": "Ana Cadde<br>2 sürüş, 102 satır<br>hız 12,5 km/h · RMS 4,35 m/s² · indeks 4,74"}, {"s": [[40.97983291412145, 29.02096258586272], [40.9800574919152, 29.021260154357453]], "r": "#fdd835", "o": 0.8, "i": "Ana Cadde<br>2 sürüş, 117 satır<br>hız 13,2 km/h · RMS 4,16 m/s² · indeks 4,68<br>1 darbe"}, {"s": [[40.97983291412145, 29.022747996831118], [40.9800574919152, 29.02304556532585]], "r": "#1a9850", "o": 0.8, "i": "Ana Cadde<br>2 sürüş, 75 satır<br>hız 18,0 km/h · RMS 1,76 m/s² · indeks 1,63<br>7 darbe"}, {"s": [[40.97983291412145, 29.021855291346917], [40.9800574919152, 29.02215285984165]], "r": "#1a9850", "o": 0.8, "i": "Ana Cadde<br>2 sürüş, 82 satır<br>hız 16,2 km/h · RMS 1,62 m/s² · indeks 1,55"}, {"s": [[40.97983291412145, 29.022450428336384], [40.9800574919152, 29.022747996831118]], "r": "#1a9850", "o": 0.8, "i": "Ana Cadde<br>2 sürüş, 94 satır<br>hız 15,8 km/h · RMS 1,53 m/s² · indeks 1,51<br>1 darbe"}, {"s": [[40.97983291412145, 29.02215285984165], [40.9800574919152, 29.022450428336384]], "r": "#1a9850", "o": 0.8, "i": "Ana Cadde<br>2 sürüş, 85 satır<br>hız 15,4 km/h · RMS 1,48 m/s² · indeks 1,46"}, {"s": [[40.97983291412145, 29.02304556532585], [40.9800574919152, 29.023343133820585]], "r": "#1a9850", "o": 0.8, "i": "Ana Cadde<br>2 sürüş, 81 satır<br>hız 17,5 km/h · RMS 1,54 m/s² · indeks 1,46"}, {"s": [[40.97983291412145, 29.023343133820585], [40.9800574919152, 29.02364070231532]], "r": "#1a9850", "o": 0.8, "i": "Ana Cadde<br>2 sürüş, 85 satır<br>hız 14,4 km/h · RMS 1,23 m/s² · indeks 1,27"}], "darbeler": [{"e": 40.98, "b": 29.022847396882987, "no": "1", "s": 2, "h": "<b>Darbe noktası 1</b><br>2 sürüş, 8 geçiş<br>en büyük tepe 28 m/s²<br>40.980000, 29.022847 ±2 m<br><a href='https://www.google.com/maps/search/?api=1&query=40.980000,29.022847' target='_blank'>Google Haritalar'da aç</a>"}, {"e": 40.98, "b": 29.020874547757156, "no": "2", "s": 2, "h": "<b>Darbe noktası 2</b><br>2 sürüş, 7 geçiş<br>en büyük tepe 31 m/s²<br>40.980000, 29.020875 ±2 m<br><a href='https://www.google.com/maps/search/?api=1&query=40.980000,29.020875' target='_blank'>Google Haritalar'da aç</a>"}, {"e": 40.98, "b": 29.021428712726205, "no": "3", "s": 2, "h": "<b>Darbe noktası 3</b><br>2 sürüş, 4 geçiş<br>en büyük tepe 22 m/s²<br>40.980000, 29.021429 ±3 m<br><a href='https://www.google.com/maps/search/?api=1&query=40.980000,29.021429' target='_blank'>Google Haritalar'da aç</a>"}, {"e": 40.9803866871019, "b": 29.02178486947937, "no": "4", "s": 1, "h": "<b>Darbe noktası 4</b><br>1 sürüş, 2 geçiş<br>en büyük tepe 43 m/s²<br>40.980387, 29.021785 ±4 m<br><a href='https://www.google.com/maps/search/?api=1&query=40.980387,29.021785' target='_blank'>Google Haritalar'da aç</a>"}, {"e": 40.9799685, "b": 29.021784869479365, "no": "5", "s": 1, "h": "<b>Darbe noktası 5</b><br>1 sürüş, 1 geçiş<br>en büyük tepe 41 m/s²<br>40.979968, 29.021785 ±6 m<br><a href='https://www.google.com/maps/search/?api=1&query=40.979968,29.021785' target='_blank'>Google Haritalar'da aç</a>"}]};
const harita = L.map('harita', { maxZoom: 21 });
// Sade altlık: renkli Esri sokak haritasının soluklaştırılmışı (CARTO artık API anahtarı istiyor)
const sade = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  { className: 'sade', maxNativeZoom: 19, maxZoom: 21, attribution: 'Esri, HERE, Garmin, &copy; OpenStreetMap katkıcıları' }).addTo(harita);
const renkli = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}',
  { maxNativeZoom: 19, maxZoom: 21, attribution: 'Esri, HERE, Garmin, &copy; OpenStreetMap katkıcıları' });
const uydu = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { maxNativeZoom: 19, maxZoom: 21, attribution: 'Uydu: Esri, Maxar, Earthstar Geographics' });
const hucre = L.layerGroup().addTo(harita), darbe = L.layerGroup().addTo(harita), sinir = [];
for (const k of V.kutular) {
  L.rectangle(k.s, { color: '#0b0b0b', weight: .5, opacity: .3, fillColor: k.r, fillOpacity: k.o }).bindTooltip(k.i).addTo(hucre);
  sinir.push(...k.s);
}
for (const d of V.darbeler)
  L.marker([d.e, d.b], { icon: L.divIcon({ className: d.s >= 2 ? 'no' : 'no tek', html: d.no, iconSize: [22, 22] }) }).bindPopup(d.h).addTo(darbe);
harita.fitBounds(sinir.length ? sinir : [[0, 0]], { padding: [30, 30] });
L.control.layers({ 'Sokak haritası (sade)': sade, 'Sokak haritası (renkli)': renkli, 'Uydu görüntüsü': uydu },
  { 'Yol kalitesi (25 m hücre)': hucre, 'Darbe noktaları': darbe }).addTo(harita);
L.control.scale({ imperial: false }).addTo(harita);
const aciklama = L.control({ position: 'bottomleft' });
aciklama.onAdd = () => {
  const k = L.DomUtil.create('div', 'kutu');
  k.innerHTML = `<b>Yol kalitesi</b><br>İndeks (15 km/h&#x27;te beklenen Dikey_RMS) (m/s²)
    <div class="serit"><span style="background:#1a9850"></span><span style="background:#66bd63"></span><span style="background:#fdd835"></span><span style="background:#fb8c00"></span><span style="background:#e53935"></span><span style="background:#8e0000"></span></div>
    <div class="uclar"><span>0</span><span>2</span><span>4</span><span>6</span><span>8</span><span>10</span><span>+</span></div>
    yeşil: düzgün, sarı: orta, kırmızı: bozuk<br>Soluk hücre / işaret: yalnızca tek sürüşte geçildi<br>
    Mor: darbe noktası (dokunun: kaç sürüşte görüldüğü)`;
  return k;
};
aciklama.addTo(harita);
</script></body></html>
