name: APK Derle

on:
  push:
    branches: ["**"]
    # Yalnızca telefon uygulamasının dosyaları değişince (analiz betikleri ve masaüstü uygulaması APK'yı etkilemez).
    # Bu iş akışı dosyası değişince derlenmez: gerekirse Actions sayfasından "Run workflow" ile elle başlatılır.
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "qgis/stiller/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      # Android NDK: SQLite kitaplığı (package:sqlite3) APK'ya yerel kitaplık olarak girdiği için gerekli. Gradle kendisi
      # indirirken bozuk dosya alabildiği için önceden ve 3 denemeyle kurulur. Sürüm Flutter 3.47.7'nin istediği NDK'dır.
      - name: Android NDK
        run: |
          for i in 1 2 3; do
            (yes || true) | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "ndk;28.2.13676358" > /dev/null && break
            echo "NDK kurulamadı, yeniden deneniyor ($i)"; sleep 15
          done
          test -d "$ANDROID_HOME/ndk/28.2.13676358"
      # Yapı numarası = derleme sırası: kayıtların _bilgi.txt dosyasında hangi APK ile alındıkları görünür
      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: mikromobilite-apk
          path: build/app/outputs/flutter-apk/app-release.apk
