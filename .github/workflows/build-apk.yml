name: APK Derle

on:
  push:
    branches: ["**"]
    # Yalnızca telefon uygulamasının dosyaları değişince (analiz betikleri ve masaüstü uygulaması APK'yı etkilemez).
    # Bu iş akışı dosyası değişince derlenmez: gerekirse Actions sayfasından "Run workflow" ile elle başlatılır.
    paths:
      - "lib/**"
      - "android/**"
      - "assets/**"
      - "pubspec.yaml"
      - "pubspec.lock"
      - "analysis_options.yaml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.7"
          cache: true

      - run: flutter pub get
      - run: flutter analyze
      # Yapı numarası = derleme sırası: kayıtların _bilgi.txt dosyasında hangi APK ile alındıkları görünür
      - run: flutter build apk --release --build-number=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: mikromobilite-apk
          path: build/app/outputs/flutter-apk/app-release.apk
